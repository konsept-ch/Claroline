<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName claroline.local
    ServerAlias claroline.test
    DocumentRoot /var/www/html/claroline/public

    Protocols h2 http/1.1
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/ssl-cert-snakeoil.pem
    SSLCertificateKeyFile /etc/ssl/private/ssl-cert-snakeoil.key

    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains" env=HTTPS

    ErrorLog /var/log/apache2/claroline-ssl-error.log
    CustomLog /var/log/apache2/claroline-ssl-access.log combined

    <Directory /var/www/html/claroline/public>
        AllowOverride None
        Require all granted

        <IfModule mod_rewrite.c>
            Options -MultiViews
            RewriteEngine On
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteRule ^(.*)$ index.php [QSA,L]
        </IfModule>
    </Directory>
</VirtualHost>
</IfModule>
