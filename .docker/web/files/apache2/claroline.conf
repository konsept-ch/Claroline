<VirtualHost *:80>
        ServerName localhost
        DocumentRoot /var/www/html/claroline/public

        Alias /packages /var/www/html/claroline/node_modules
        <Directory /var/www/html/claroline/node_modules>
                Options FollowSymLinks
                AllowOverride None
                Require all granted
        </Directory>

        Alias /data /var/www/html/claroline/files/data
        <Directory /var/www/html/claroline/files/data>
                Options FollowSymLinks
                AllowOverride None
                Require all granted
        </Directory>

        <Directory /var/www/html/claroline/public>
                AllowOverride None
                Order Allow,Deny
                Allow from All

                <IfModule mod_rewrite.c>
                    Options -MultiViews
                    RewriteEngine On
                    RewriteCond %{REQUEST_FILENAME} !-f
                    RewriteRule ^(.*)$ index.php [QSA,L]
                </IfModule>
        </Directory>
</VirtualHost>
