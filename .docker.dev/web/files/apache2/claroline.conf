<VirtualHost *:80>
    ServerName claroline.local
    ServerAlias claroline.test
    DocumentRoot /var/www/html/claroline/public

    ErrorLog /var/log/apache2/claroline-error.log
    CustomLog /var/log/apache2/claroline-access.log combined

    <Directory /var/www/html/claroline/public>
        AllowOverride None
        Require all granted

        <IfModule mod_rewrite.c>
            Options -MultiViews
            RewriteEngine On
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteRule ^(.*)$ index.php [QSA,L]
        </IfModule>
    </Directory>
</VirtualHost>
